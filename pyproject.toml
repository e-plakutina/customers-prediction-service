[project]
name = "customers-prediction-service"
version = "0.0.1"
description = "Service for predicting the number of restaurant's customers"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "seaborn",
    "numpy"
]

[dependency-groups]
dev = [
    "pytest"
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "customers_prediction"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"