[project]
name = "customers-prediction-service"
version = "0.0.1"
description = "Service for predicting the number of restaurant's customers"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pandas",
    "scikit-learn",
    "joblib",
    "numpy",
    "lightgbm>=4.7.0",
]

[dependency-groups]
data = [
    "kagglehub>=1.0.2",
]
dev = [
    "httpx2>=2.13.1",
    "pytest",
]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "customers_prediction"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
